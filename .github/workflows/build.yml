name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 用 ImageMagick 把 png 转成 ico
        shell: cmd
        run: |
          magick tubiao.png -define icon:auto-resize=256,128,64,48,32,16 tubiao.ico

      - name: 编译 Java
        shell: cmd
        run: |
          chcp 65001
          javac -encoding UTF-8 -d out Main.java

      - name: 打包 JAR
        shell: cmd
        run: |
          chcp 65001
          jar --create --file MyApp.jar --main-class Main -C out .

      - name: 准备干净的 input 目录
        shell: cmd
        run: |
          mkdir input
          copy MyApp.jar input\

      - name: jpackage 生成带图标的自包含 EXE
        shell: cmd
        run: |
          chcp 65001
          jpackage --type app-image --name RandomPicker --input input --main-jar MyApp.jar --main-class Main --icon tubiao.ico --dest output

      - name: 压缩输出
        shell: cmd
        run: |
          powershell Compress-Archive -Path output\RandomPicker -DestinationPath RandomPicker.zip

      - name: 上传打包结果
        uses: actions/upload-artifact@v4
        with:
          name: RandomPicker-EXE
          path: RandomPicker.zip
